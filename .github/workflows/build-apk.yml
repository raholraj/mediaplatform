name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -ex
          ls -la
          unzip -o mediaplatform.zip
          ls -la mediaplatform/
          test -f mediaplatform/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p mediaplatform/app
          if [ -n "$GS" ]; then
            echo "$GS" | base64 -d > mediaplatform/app/google-services.json
            echo "From secret OK"
          else
            echo "Using embedded"
            cat > mediaplatform/app/google-services.json << 'EJSON'
{
  "project_info": {
    "project_number": "854693277536",
    "firebase_url": "https://app-midia-7043a-default-rtdb.firebaseio.com",
    "project_id": "app-midia-7043a",
    "storage_bucket": "app-midia-7043a.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:854693277536:android:3bf351cdcefa81d0e6b805",
        "android_client_info": {
          "package_name": "com.gugugaga.mediaplatform"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyARkI7khi9YmehCOvZuxssnhnOWU9aipRw"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EJSON
          fi

      - name: Build APK
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        working-directory: mediaplatform
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mediaplatform/app/build/outputs/apk/debug/*.apk

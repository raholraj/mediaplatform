      - name: Build APK
        working-directory: mediaplatform
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mediaplatform/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

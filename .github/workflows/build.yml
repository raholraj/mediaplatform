name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project structure
        run: |
          echo "=== Project root ==="
          ls -la
          echo ""
          echo "=== app/ ==="
          ls -la app/ || echo "app/ missing"
          echo ""
          echo "=== Source tree (kt files) ==="
          find app -name "*.kt" 2>/dev/null | head -40 || echo "No .kt files found"
          echo ""
          echo "=== gradlew ==="
          ls -la gradlew gradle/wrapper/ 2>/dev/null || echo "gradle wrapper missing"

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "ERROR: Secret GOOGLE_SERVICES_JSON_BASE64 is missing"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          echo "google-services.json written ($(wc -c < app/google-services.json) bytes)"

      - name: Decode debug keystore (optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
            echo "Fixed debug keystore restored"
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret - using default debug key"
          fi

      - name: Make gradlew executable
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing from repository"
            exit 1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          echo "Starting ./gradlew assembleDebug ..."
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build.log
          echo "Gradle exit code: $?"

      - name: Show build output location
        if: always()
        run: |
          echo "=== Looking for APK ==="
          find app/build -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "debug output dir missing"
          echo "=== Last 80 lines of build.log ==="
          tail -80 build.log 2>/dev/null || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

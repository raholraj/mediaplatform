name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and prepare project
        run: |
          set -e
          echo "=== Current root ==="
          ls -la

          # Remove conflicting partial project files so zip can fully replace them
          rm -rf app gradle build.gradle.kts settings.gradle.kts gradle.properties gradlew database.rules.json README.md .gitignore 2>/dev/null || true

          if [ ! -f mediaplatform.zip ]; then
            echo "ERROR: mediaplatform.zip not found!"
            exit 1
          fi

          echo "=== Unzipping ==="
          unzip -o mediaplatform.zip

          if [ -d mediaplatform ]; then
            echo "=== Moving project files to root ==="
            # Move everything including hidden files carefully
            shopt -s dotglob nullglob
            for item in mediaplatform/*; do
              name=$(basename "$item")
              if [ -e "./$name" ]; then
                rm -rf "./$name"
              fi
              mv "$item" .
            done
            rmdir mediaplatform 2>/dev/null || true
          fi

          echo "=== After extract ==="
          ls -la
          echo "=== Checking key files ==="
          ls -la gradlew app/build.gradle.kts settings.gradle.kts || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json created from secret"
            head -c 100 app/google-services.json
            echo "..."
          else
            echo "WARNING: Secret GOOGLE_SERVICES_JSON_BASE64 is missing. Using embedded dummy."
            cat > app/google-services.json << 'EOF'
{
  "project_info": {
    "project_number": "854693277536",
    "firebase_url": "https://app-midia-7043a-default-rtdb.firebaseio.com",
    "project_id": "app-midia-7043a",
    "storage_bucket": "app-midia-7043a.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:854693277536:android:3bf351cdcefa81d0e6b805",
        "android_client_info": {
          "package_name": "com.gugugaga.mediaplatform"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyARkI7khi9YmehCOvZuxssnhnOWU9aipRw"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      - name: Build Debug APK
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip if needed
        run: |
          ls -la
          if [ -f mediaplatform.zip ]; then
            unzip -o mediaplatform.zip
            ls -la mediaplatform/ || true
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json
        run: |
          mkdir -p app
          mkdir -p mediaplatform/app
          cat > app/google-services.json << 'ENDJSON'
{
  "project_info": {
    "project_number": "854693277536",
    "firebase_url": "https://app-midia-7043a-default-rtdb.firebaseio.com",
    "project_id": "app-midia-7043a",
    "storage_bucket": "app-midia-7043a.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:854693277536:android:3bf351cdcefa81d0e6b805",
        "android_client_info": {
          "package_name": "com.gugugaga.mediaplatform"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyARkI7khi9YmehCOvZuxssnhnOWU9aipRw"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
ENDJSON
          cp app/google-services.json mediaplatform/app/google-services.json 2>/dev/null || true
          echo "google-services.json ready"
          cat app/google-services.json | head -3

      - name: Build APK
        run: |
          if [ -f mediaplatform/gradlew ]; then
            cd mediaplatform
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found"
            find . -name "gradlew" -o -name "*.gradle.kts" | head -20
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract zip
        run: |
          echo "Files in root:"
          ls -la
          if [ -f mediaplatform.zip ]; then
            echo "Unzipping mediaplatform.zip..."
            unzip -o mediaplatform.zip
            if [ -d mediaplatform ]; then
              echo "Moving files from mediaplatform/ to root"
              shopt -s dotglob
              mv mediaplatform/* .
              rmdir mediaplatform || true
            fi
            echo "After extract:"
            ls -la
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json created from secret"
          else
            echo "Secret missing - creating dummy"
            echo '{"project_info":{"project_number":"854693277536","project_id":"app-midia-7043a","storage_bucket":"app-midia-7043a.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:854693277536:android:3bf351cdcefa81d0e6b805","android_client_info":{"package_name":"com.gugugaga.mediaplatform"}},"api_key":[{"current_key":"AIzaSyARkI7khi9YmehCOvZuxssnhnOWU9aipRw"}]}],"configuration_version":"1"}' > app/google-services.json
          fi
          ls -la app/google-services.json

      - name: Build APK
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

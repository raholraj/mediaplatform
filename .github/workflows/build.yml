name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project from zip
        run: |
          if [ -f mediaplatform.zip ]; then
            echo "Extracting mediaplatform.zip..."
            unzip -o mediaplatform.zip
            # Move contents to root if nested
            if [ -d mediaplatform ]; then
              cp -r mediaplatform/* .
              cp -r mediaplatform/.* . 2>/dev/null || true
              rm -rf mediaplatform
            fi
            ls -la
          else
            echo "No zip found, assuming source is already present"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "google-services.json decoded successfully"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON_BASE64 secret is missing."
            echo "Creating a dummy google-services.json so build can continue (Firebase features will not work)."
            cat > app/google-services.json << 'EOF'
{
  "project_info": {
    "project_number": "000000000000",
    "project_id": "dummy-project",
    "storage_bucket": "dummy-project.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
        "android_client_info": {
          "package_name": "com.gugugaga.mediaplatform"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyDummyKeyForBuildOnly0000000000000"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      - name: Decode fixed debug keystore (optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
            echo "Using fixed debug keystore from secret"
          else
            echo "No fixed keystore secret; using default debug key"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew || chmod +x mediaplatform/gradlew || true

      - name: Build Debug APK
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f mediaplatform/gradlew ]; then
            cd mediaplatform && ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew not found!"
            find . -name "gradlew" -type f
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            mediaplatform/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
